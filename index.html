*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body{
  background:#080810;
  min-height:100vh;
  font-family:'DM Sans',sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow-x:hidden;
}

.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:0.13;pointer-events:none;}
.orb1{width:400px;height:400px;top:-100px;left:-120px;background:#a855f7;animation:o1 14s ease-in-out infinite alternate;}
.orb2{width:350px;height:350px;bottom:-80px;right:-100px;background:#06b6d4;animation:o2 16s ease-in-out infinite alternate;}
.orb3{width:240px;height:240px;top:50%;left:50%;margin:-120px 0 0 -120px;background:#f43f5e;animation:o3 18s ease-in-out infinite alternate;}
@keyframes o1{to{transform:translate(40px,50px)}}
@keyframes o2{to{transform:translate(-40px,-50px)}}
@keyframes o3{to{transform:translate(30px,-30px)}}

.card{
  position:relative;z-index:1;
  width:min(420px,92vw);
  padding:28px 24px 36px;
  background:rgba(10,10,22,0.9);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:30px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 40px 80px rgba(0,0,0,0.6);
  animation:cardIn 0.8s cubic-bezier(.22,1,.36,1) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:translateY(0)}}

.header{display:flex;align-items:center;gap:16px;margin-bottom:18px;animation:fadeUp 0.6s 0.1s both;}

.avatar-wrap{position:relative;flex-shrink:0;width:78px;height:78px;}
.avatar-glow{
  position:absolute;inset:-10px;border-radius:50%;
  will-change:background,box-shadow;
  animation:rgbGlow 2.5s linear infinite;
  filter:blur(12px);opacity:0.8;z-index:0;
}
.avatar-ring{
  position:absolute;inset:-3px;border-radius:50%;
  background:conic-gradient(#ff0055,#ff7700,#ffff00,#00ff88,#00cfff,#7700ff,#ff00cc,#ff0055);
  will-change:transform;
  animation:spinRing 3s linear infinite;
  z-index:1;
}
.avatar-ring::after{content:'';position:absolute;inset:3px;border-radius:50%;background:#080810;}
.avatar{position:absolute;inset:0;width:78px;height:78px;border-radius:50%;object-fit:cover;z-index:2;display:block;}

@keyframes spinRing{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes rgbGlow{
  0%  {background:#ff0055;box-shadow:0 0 18px 6px rgba(255,0,85,0.6)}
  14% {background:#ff7700;box-shadow:0 0 18px 6px rgba(255,119,0,0.6)}
  28% {background:#ffff00;box-shadow:0 0 18px 6px rgba(255,255,0,0.5)}
  42% {background:#00ff88;box-shadow:0 0 18px 6px rgba(0,255,136,0.6)}
  57% {background:#00cfff;box-shadow:0 0 18px 6px rgba(0,207,255,0.6)}
  71% {background:#7700ff;box-shadow:0 0 18px 6px rgba(119,0,255,0.6)}
  85% {background:#ff00cc;box-shadow:0 0 18px 6px rgba(255,0,204,0.6)}
  100%{background:#ff0055;box-shadow:0 0 18px 6px rgba(255,0,85,0.6)}
}

.header-text{flex:1;min-width:0;}
.badge{font-size:9.5px;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:0.2em;color:rgba(255,255,255,0.28);text-transform:uppercase;margin-bottom:3px;}
.name{font-family:'Syne',sans-serif;font-size:23px;font-weight:800;color:#fff;letter-spacing:-0.01em;line-height:1.1;}
.tagline{margin-top:5px;font-size:11.5px;color:rgba(255,255,255,0.42);font-weight:300;line-height:1.4;}

/* TICKER */
.ticker-outer{
  overflow:hidden;
  margin:0 0 20px;
  padding:9px 0;
  border-radius:10px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  position:relative;
}
.ticker-outer::before,.ticker-outer::after{
  content:'';position:absolute;top:0;bottom:0;width:36px;z-index:2;pointer-events:none;
}
.ticker-outer::before{left:0;background:linear-gradient(90deg,rgba(10,10,22,0.95),transparent);}
.ticker-outer::after{right:0;background:linear-gradient(-90deg,rgba(10,10,22,0.95),transparent);}

.ticker-track{
  display:flex;
  width:max-content;
  will-change:transform;
  /* JS will add animation */
}
.ticker-item{
  font-size:12px;
  color:rgba(255,255,255,0.5);
  white-space:nowrap;
  padding:0 28px;
  flex-shrink:0;
}
.ticker-item b{
  background:linear-gradient(90deg,#a855f7,#06b6d4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  font-weight:600;
}

.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.07),transparent);margin:0 0 20px;}

.links{display:flex;flex-direction:column;gap:12px;}

.link-btn{
  position:relative;
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 18px;
  border-radius:16px;border:1px solid transparent;
  text-decoration:none;overflow:hidden;cursor:pointer;
  transition:transform 0.2s cubic-bezier(.34,1.56,.64,1),box-shadow 0.2s;
  animation:fadeUp 0.5s both;
  will-change:transform;
}
.link-btn:nth-child(1){animation-delay:0.25s}
.link-btn:nth-child(2){animation-delay:0.35s}
.link-btn:nth-child(3){animation-delay:0.45s}
.link-btn:hover{transform:translateY(-2px) scale(1.012);}
.link-btn:active{transform:scale(0.98);}
.link-btn::after{
  content:'';position:absolute;top:0;left:-100%;
  width:55%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.09),transparent);
  transform:skewX(-18deg);transition:left 0.45s ease;
}
.link-btn:hover::after{left:160%;}

.btn-left{display:flex;align-items:center;gap:13px;}
.btn-icon{width:42px;height:42px;border-radius:11px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.btn-icon svg{width:42px;height:42px;display:block;}
.btn-text{display:flex;flex-direction:column;gap:1px;}
.btn-label{font-family:'Syne',sans-serif;font-size:14.5px;font-weight:700;color:#fff;}
.btn-sub{font-size:11px;color:rgba(255,255,255,0.38);}
.btn-arr{font-size:17px;color:rgba(255,255,255,0.35);transition:transform 0.18s,color 0.18s;}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

<script>
// JS-based smooth ticker — pixel-perfect seamless loop
(function(){
  const track = document.getElementById('tickerTrack');
  const src   = document.getElementById('tickerSrc');

  // Clone enough copies to fill screen + loop
  function setup() {
    const itemW = src.getBoundingClientRect().width;
    const needed = Math.ceil(window.innerWidth / itemW) + 2;
    // Remove old clones
    track.querySelectorAll('.clone').forEach(el => el.remove());
    for (let i = 0; i < needed + 1; i++) {
      const clone = src.cloneNode(true);
      clone.removeAttribute('id');
      clone.classList.add('clone');
      track.appendChild(clone);
    }
  }

  setup();

  const speed = 60; // px per second
  let pos = 0;
  let last = null;
  const itemW = () => src.getBoundingClientRect().width;

  function tick(ts) {
    if (!last) last = ts;
    const dt = (ts - last) / 1000;
    last = ts;
    pos -= speed * dt;
    const w = itemW();
    if (pos <= -w) pos += w;
    track.style.transform = `translate3d(${pos}px,0,0)`;
    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
  window.addEventListener('resize', setup);
})();
</script>
