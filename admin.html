<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Panel – Surajfx</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080810;--card:#0f0f1e;--border:rgba(255,255,255,.08);--purple:#a855f7;--pink:#ec4899;--orange:#f97316;--text:#f8fafc;--muted:#94a3b8;--grad:linear-gradient(135deg,#a855f7,#ec4899,#f97316);--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px 32px;max-width:380px;width:100%;text-align:center}
.login-logo{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.login-sub{color:var(--muted);font-size:14px;margin-bottom:28px}
.inp{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:13px 16px;color:var(--text);font-size:15px;outline:none;transition:border-color .2s;margin-bottom:12px;font-family:'DM Sans',sans-serif}
.inp:focus{border-color:rgba(168,85,247,.6)}
.inp::placeholder{color:var(--muted)}
.btn-login{width:100%;background:var(--grad);color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;padding:14px;border-radius:10px;border:none;cursor:pointer;transition:opacity .2s}
.btn-login:hover{opacity:.9}
.err{color:#f87171;font-size:13px;margin-top:8px;display:none}
.admin-wrap{display:none;max-width:900px;margin:0 auto;padding:20px 16px 60px}
.admin-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;padding:16px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.admin-title{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.btn-logout{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:100px;font-size:13px;cursor:pointer;font-family:'Syne',sans-serif;font-weight:600}
.section{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:24px}
.section-title{font-family:'Syne',sans-serif;font-weight:700;font-size:16px;margin-bottom:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.finp{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;font-family:'DM Sans',sans-serif;width:100%}
.finp:focus{border-color:rgba(168,85,247,.6)}
.finp::placeholder{color:rgba(148,163,184,.5);font-size:13px}
.btn-add{background:var(--grad);color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;padding:13px 28px;border-radius:10px;border:none;cursor:pointer;margin-top:4px}
.btn-add:disabled{opacity:.5;cursor:not-allowed}
.success-msg{color:#4ade80;font-size:13px;margin-top:8px;display:none}
.tpl-list{display:flex;flex-direction:column;gap:10px}
.tpl-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.tpl-num{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;min-width:80px}
.tpl-info{flex:1;min-width:0}
.tpl-date{font-size:11px;color:var(--muted)}
.btn-del{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#f87171;padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Syne',sans-serif;font-weight:600}
.empty-list{text-align:center;color:var(--muted);font-size:14px;padding:32px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(168,85,247,.3);border-top-color:#a855f7;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">⚙️ Admin Panel</div>
    <div class="login-sub">Surajfx Template Manager</div>
    <input class="inp" type="password" id="pwdInput" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-login" onclick="doLogin()">Login →</button>
    <div class="err" id="loginErr">❌ Wrong password!</div>
  </div>
</div>

<div class="admin-wrap" id="adminWrap">
  <div class="admin-nav">
    <div class="admin-title">⚙️ Surajfx Admin</div>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

  <div class="section">
    <div class="section-title">➕ নতুন Template Add করো</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Template Number *</label>
        <input class="finp" type="number" id="fNum" placeholder="e.g. 251">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select class="finp" id="fCat">
          <option value="trending">🔥 Trending</option>
          <option value="cinematic">🎬 Cinematic</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Google Drive Video Link *</label>
        <input class="finp" type="url" id="fVideo" placeholder="https://drive.google.com/file/d/xxxxx/view">
      </div>
      <div class="form-group full">
        <label>CapCut Template Link *</label>
        <input class="finp" type="url" id="fCapcut" placeholder="https://capcut-yt.onelink.me/...">
      </div>
      <div class="form-group full">
        <label>How to Use Video Link (optional — blank হলে default যাবে)</label>
        <input class="finp" type="url" id="fHowto" placeholder="https://youtu.be/...">
      </div>
    </div>
    <div style="margin-top:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <button class="btn-add" id="addBtn" onclick="addTemplate()">✦ Add Template</button>
      <div class="success-msg" id="successMsg">✅ Template added! Site এ দেখা যাবে।</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📋 সব Templates (<span id="totalCount">0</span>)</div>
    <div class="tpl-list" id="tplList">
      <div class="empty-list"><span class="spin"></span> Loading...</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push, remove }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyDCb00ReMC3BScf1E51pvsp9F6Denq5nqM",
  authDomain:"surajfx-dbfbf.firebaseapp.com",
  databaseURL:"https://surajfx-dbfbf-default-rtdb.firebaseio.com",
  projectId:"surajfx-dbfbf",
  storageBucket:"surajfx-dbfbf.firebasestorage.app",
  messagingSenderId:"1082799197835",
  appId:"1:1082799197835:web:50a062f8f00f49c3570e8e"
});
const db = getDatabase(app);
const PASS = "suraj@pubg";

if(sessionStorage.getItem('sx_admin')==='1') showAdmin();

window.doLogin = function(){
  if(document.getElementById('pwdInput').value === PASS){
    sessionStorage.setItem('sx_admin','1');
    showAdmin();
  } else {
    document.getElementById('loginErr').style.display='block';
  }
};

window.logout = function(){
  sessionStorage.removeItem('sx_admin');
  location.reload();
};

function showAdmin(){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('adminWrap').style.display='block';
  loadList();
}

function loadList(){
  onValue(ref(db,'templates'), snap=>{
    const data = snap.val()||{};
    const items = Object.entries(data).sort((a,b)=>(b[1].num||0)-(a[1].num||0));
    document.getElementById('totalCount').textContent = items.length;
    const list = document.getElementById('tplList');
    if(!items.length){
      list.innerHTML='<div class="empty-list">কোনো template নেই। প্রথম template add করো!</div>';
      return;
    }
    list.innerHTML = items.map(([id,t])=>`
      <div class="tpl-item">
        <div class="tpl-num">#${t.num||'?'}</div>
        <div class="tpl-info">
          <div style="font-size:13px;font-weight:600;margin-bottom:3px">Template #${t.num}</div>
          <div class="tpl-date">Added: ${t.addedAt?new Date(t.addedAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'Unknown'} &nbsp;·&nbsp; ${t.cat||'trending'}</div>
        </div>
        <button class="btn-del" onclick="delTemplate('${id}')">🗑 Delete</button>
      </div>
    `).join('');
  });
}

window.addTemplate = async function(){
  const num = document.getElementById('fNum').value.trim();
  const video = document.getElementById('fVideo').value.trim();
  const capcut = document.getElementById('fCapcut').value.trim();
  const howto = document.getElementById('fHowto').value.trim();
  const cat = document.getElementById('fCat').value;

  if(!num||!video||!capcut){
    alert('Template number, video link এবং CapCut link দিতে হবে!');
    return;
  }
  const btn = document.getElementById('addBtn');
  btn.disabled=true;
  btn.innerHTML='<span class="spin"></span> Adding...';
  try{
    await push(ref(db,'templates'),{
      num:parseInt(num), video, capcut,
      howto:howto||'', cat,
      addedAt:Date.now()
    });
    ['fNum','fVideo','fCapcut','fHowto'].forEach(id=>document.getElementById(id).value='');
    const msg=document.getElementById('successMsg');
    msg.style.display='block';
    setTimeout(()=>msg.style.display='none',3000);
  }catch(e){alert('Error: '+e.message);}
  btn.disabled=false;
  btn.innerHTML='✦ Add Template';
};

window.delTemplate = async function(id){
  if(!confirm('এই template delete করবে? Undo হবে না!')) return;
  await remove(ref(db,'templates/'+id));
};
</script>
</body>
</html>
